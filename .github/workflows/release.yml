name: Release

on:
  push:
    tags: ['v*']

env:
  DEVECO_SDK_HOME: ${{ github.workspace }}/harmonyos-sdk
  OHOS_NDK: ${{ github.workspace }}/harmonyos-sdk/default/openharmony/native
  # Command Line Tools 下载地址（Linux x64，按实际版本更新）
  CMD_TOOLS_URL: https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/developer_alliance_dev_20250630/static/commandline-tools-linux-x64-5.0.5.300.zip

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HarmonyOS SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: harmonyos-sdk
          key: hmos-sdk-${{ env.CMD_TOOLS_VERSION }}-v1

      - name: Download Command Line Tools
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -L -o /tmp/cmd-tools.zip "$CMD_TOOLS_URL"
          mkdir -p harmonyos-sdk
          unzip -q /tmp/cmd-tools.zip -d /tmp/cmd-tools
          # Command Line Tools 解压后通常在 command-line-tools/ 目录
          mv /tmp/cmd-tools/*/sdk/default harmonyos-sdk/default 2>/dev/null || true
          mv /tmp/cmd-tools/*/sdk/* harmonyos-sdk/ 2>/dev/null || true
          # 清理
          rm -rf /tmp/cmd-tools /tmp/cmd-tools.zip

      - name: Setup PATH
        run: |
          # ohpm 和 hvigor 在 command-line-tools 下
          TOOLS_BIN="${{ github.workspace }}/harmonyos-sdk/../command-line-tools/bin"
          echo "$TOOLS_BIN" >> $GITHUB_PATH
          echo "$DEVECO_SDK_HOME/default/openharmony/toolchains" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          which ohpm || echo "ohpm not found, checking alt paths..."
          ls harmonyos-sdk/default/openharmony/native/llvm/bin/ 2>/dev/null | head -3 || echo "NDK not found"

      - name: Build wheel
        run: bash build.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: binrunner-wheel
          path: dist/*.whl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binrunner-wheel
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
