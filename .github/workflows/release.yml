name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: ghcr.io/${{ github.repository_owner }}/binrunner-sdk:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check tag matches __version__
        # 防 v1.1.0 事故：忘升 __version__ 导致 wheel 版本与 tag 不符（#1）
        run: |
          tag="${{ github.ref_name }}"
          tag_ver="${tag#v}"
          pkg_ver=$(python -c "from binrunner import __version__; print(__version__)")
          echo "tag=${tag_ver}  __version__=${pkg_ver}"
          if [ "$tag_ver" != "$pkg_ver" ]; then
            echo "::error::tag ${tag} 与 binrunner.__version__ (${pkg_ver}) 不一致，先升 binrunner/__init__.py 的版本号再发版"
            exit 1
          fi

      - name: Build wheel
        run: |
          # 确保 SDK toolchain 在 PATH（setup-python 可能覆盖容器 PATH）
          export PATH="/opt/command-line-tools/bin:/opt/command-line-tools/hvigor/bin:/opt/harmonyos-sdk/default/openharmony/native/llvm/bin:/opt/harmonyos-sdk/default/openharmony/toolchains:$PATH"
          echo "PATH=$PATH"
          which aarch64-unknown-linux-ohos-clang
          bash build.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: binrunner-wheel
          path: dist/*.whl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          body_path: RELEASE.md
