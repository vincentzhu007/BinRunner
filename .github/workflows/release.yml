name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/binrunner-sdk:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          # 确保 SDK toolchain 在 PATH（容器 PATH 可能被 setup-python 覆盖）
          export PATH="/opt/command-line-tools/bin:/opt/command-line-tools/hvigor/bin:/opt/harmonyos-sdk/default/openharmony/toolchains:$PATH"
          echo "PATH=$PATH"
          which aarch64-unknown-linux-ohos-clang
          bash build.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: binrunner-wheel
          path: dist/*.whl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
