name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  SDK_IMAGE: ghcr.io/${{ github.repository_owner }}/binrunner-sdk:latest

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ${{ env.SDK_IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify SDK
        run: |
          ohpm --version
          hvigorw --version
          which aarch64-unknown-linux-ohos-clang

      - name: Configure PATH
        run: |
          # 从容器中定位 native toolchain（可能在 command-line-tools 下或独立 SDK 下）
          CLANG_DIR=$(dirname "$(which aarch64-unknown-linux-ohos-clang)")
          echo "$CLANG_DIR" >> $GITHUB_PATH

      - name: Build wheel
        run: bash build.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: binrunner-wheel
          path: dist/*.whl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binrunner-wheel
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
