name: Build SDK Image

on:
  workflow_dispatch:
    inputs:
      cmd_tools_url:
        description: 'Command Line Tools 下载 URL（含 command-line-tools + sdk）'
        required: true
        default: 'https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/33/v3/upQ8jIoTTXGuKCRYmZjmEQ/commandline-tools-linux-x64-6.1.1.300.zip?HW-CC-KV=V1&HW-CC-Date=20260805T171451Z&HW-CC-Expire=315360000&HW-CC-Sign=B9AEFD61A3272918D9140430607CB849C9980EA4246008CCD9E08205615974AD'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/binrunner-sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SDK image
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          build-args: |
            CMD_TOOLS_URL=${{ inputs.cmd_tools_url }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
