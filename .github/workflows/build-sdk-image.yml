name: Build SDK Image

on:
  workflow_dispatch:
    inputs:
      cmd_tools_url:
        description: 'Command Line Tools 下载 URL（含 ohpm/hvigor/hdc）'
        required: true
      native_sdk_url:
        description: 'Native SDK 下载 URL（含 aarch64 clang/sysroot）'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/binrunner-sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SDK image
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          build-args: |
            CMD_TOOLS_URL=${{ inputs.cmd_tools_url }}
            NATIVE_SDK_URL=${{ inputs.native_sdk_url }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
